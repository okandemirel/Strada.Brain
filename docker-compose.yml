# =============================================================================
# Strada.Brain - Production Docker Compose Configuration
# =============================================================================
# Usage:
#   docker compose up -d                        # Production: strada-brain + nginx
#   docker compose --profile monitoring up -d   # ... plus Prometheus and Grafana
#   docker compose down                         # Stop all services
#   docker compose logs -f strada-brain         # View logs
#
# Development (hot reload, no nginx) is an explicit second file, never an
# auto-loaded docker-compose.override.yml (OPS-5):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Environment Variables (create .env file):
#   ANTHROPIC_API_KEY=sk-ant-...
#   TELEGRAM_BOT_TOKEN=123456:ABC...
#   DISCORD_BOT_TOKEN=...
#   SLACK_BOT_TOKEN=xoxb-...
# =============================================================================

version: "3.8"

services:
  # ===========================================================================
  # Main Application - Strada.Brain
  # ===========================================================================
  strada-brain:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: strada-brain
    hostname: strada-brain
    environment:
      # Core
      - NODE_ENV=production
      
      # AI Providers (Required)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PROVIDER_CHAIN=${PROVIDER_CHAIN:-claude}
      
      # Bot Tokens
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      - SLACK_SOCKET_MODE=${SLACK_SOCKET_MODE:-true}
      
      # Security
      - ALLOWED_TELEGRAM_USER_IDS=${ALLOWED_TELEGRAM_USER_IDS:-}
      - ALLOWED_SLACK_WORKSPACES=${ALLOWED_SLACK_WORKSPACES:-}
      - ALLOWED_SLACK_USER_IDS=${ALLOWED_SLACK_USER_IDS:-}
      - REQUIRE_EDIT_CONFIRMATION=${REQUIRE_EDIT_CONFIRMATION:-true}
      - READ_ONLY_MODE=${READ_ONLY_MODE:-false}
      
      # Project Paths
      - UNITY_PROJECT_PATH=/app/project
      
      # Listeners. 127.0.0.1 is the CONTAINER's loopback, so a published port
      # would reach nothing; the container binds all interfaces and the port
      # mapping below — host loopback only (OPS-4) — is what limits exposure
      # (14F2/D71).
      - BIND_HOST=${BIND_HOST:-0.0.0.0}
      # Host names the listeners answer for besides localhost and IP literals
      # (CHN-2). Prometheus scrapes this container as `strada-brain`; add the
      # public hostname nginx serves, since nginx forwards the client's Host.
      - HTTP_ALLOWED_HOSTS=strada-brain,${HTTP_ALLOWED_HOSTS:-}
      # The public origin nginx serves (e.g. https://brain.example.com): the
      # portal's WebSocket and mutating requests are refused from any other.
      - WEB_TRUSTED_ORIGINS=${WEB_TRUSTED_ORIGINS:-}

      # Web portal + chat WebSocket + /health: what nginx proxies to (OPS-6)
      - WEB_CHANNEL_PORT=3000

      # Dashboard API (the portal proxies its /api/* here) & Prometheus exporter
      - DASHBOARD_ENABLED=${DASHBOARD_ENABLED:-true}
      - DASHBOARD_PORT=3100
      - ENABLE_PROMETHEUS=${ENABLE_PROMETHEUS:-true}
      - PROMETHEUS_PORT=9090
      
      # Memory
      - MEMORY_ENABLED=${MEMORY_ENABLED:-true}
      - MEMORY_DB_PATH=/app/.strada-memory
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=/app/logs/strada-brain.log
    
    volumes:
      # Unity project (read-only for security)
      - type: bind
        source: ${UNITY_PROJECT_PATH:-./project}
        target: /app/project
        read_only: true
      
      # Config root (STRADA_HOME=/app/.strada, set by the image): .env, the
      # trust/owner databases and runtime state. The root filesystem is
      # read-only, so without this volume the startup mkdir fails and the
      # container restart-loops (OPS-3).
      - type: volume
        source: strada-home
        target: /app/.strada

      # Persistent memory storage
      - type: volume
        source: strada-memory
        target: /app/.strada-memory
      
      # Log files
      - type: volume
        source: strada-logs
        target: /app/logs
      
      # Optional: Custom plugins
      - type: bind
        source: ${PLUGINS_PATH:-./plugins}
        target: /app/plugins
        read_only: true
        bind:
          create_host_path: true
    
    # Published on the HOST's loopback only (OPS-4): nginx is the public entry
    # point and reaches this container over strada-network. Docker's published
    # ports bypass host firewalls such as ufw, so a mapping without a host IP
    # would expose the dashboard and metrics on every interface.
    ports:
      - "127.0.0.1:${WEB_CHANNEL_PORT:-3000}:3000"  # Web portal + chat WebSocket
      - "127.0.0.1:${DASHBOARD_PORT:-3100}:3100"    # Dashboard API
      - "127.0.0.1:${METRICS_PORT:-9090}:9090"      # Prometheus metrics
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-2}'
          memory: ${MEMORY_LIMIT:-2G}
        reservations:
          cpus: '${CPU_RESERVATION:-0.5}'
          memory: ${MEMORY_RESERVATION:-512M}
      restart_policy:
        condition: unless-stopped
        delay: 5s
        max_attempts: 3
        window: 120s
    
    # Health check
    # The web channel's /health (OPS-6). 127.0.0.1, not localhost, which
    # busybox wget may resolve to ::1 only.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    
    # Security
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    
    # Networking
    networks:
      - strada-network
    
    # Graceful shutdown
    stop_grace_period: 30s
    stop_signal: SIGTERM

  # ===========================================================================
  # Redis (opt-in: `--profile redis`)
  # ===========================================================================
  # Nothing in Strada.Brain reads REDIS_URL today, so the application neither
  # waits for nor talks to this service (OPS-6); it is kept only for operators
  # who run their own tooling against it. Set REDIS_PASSWORD when you enable it.
  redis:
    image: redis:7.4-alpine
    container_name: strada-redis
    hostname: redis
    restart: unless-stopped
    profiles:
      - redis
    
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite yes
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    
    volumes:
      - type: volume
        source: redis-data
        target: /data
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    # Security
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=10m
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    
    networks:
      - strada-network
    
    # No external exposure
    expose:
      - "6379"

  # ===========================================================================
  # Nginx - Reverse Proxy & SSL Termination
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: strada-nginx
    hostname: nginx
    restart: unless-stopped
    
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    
    volumes:
      # Nginx configuration
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      
      # SSL certificates
      - type: bind
        source: ${SSL_CERT_PATH:-./nginx/ssl}
        target: /etc/nginx/ssl
        read_only: true
        bind:
          create_host_path: true
      
      # Let's Encrypt (optional)
      - type: volume
        source: letsencrypt-data
        target: /etc/letsencrypt
      
      # Nginx cache
      - type: volume
        source: nginx-cache
        target: /var/cache/nginx
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Security
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run:noexec,nosuid,size=10m
      - /tmp:noexec,nosuid,size=10m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    
    networks:
      - strada-network
    
    depends_on:
      strada-brain:
        condition: service_healthy

  # ===========================================================================
  # Prometheus - Metrics Collection (Optional)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: strada-prometheus
    hostname: prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      # No --web.enable-lifecycle (OPS-4): it adds unauthenticated
      # reload/shutdown endpoints. Restart the container to reload the config.
    
    volumes:
      - type: bind
        source: ./monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: volume
        source: prometheus-data
        target: /prometheus
    
    # Host loopback only (OPS-4); Grafana reaches it over strada-network.
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    
    networks:
      - strada-network
    
    depends_on:
      - strada-brain

  # ===========================================================================
  # Grafana - Visualization (Optional)
  # ===========================================================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: strada-grafana
    hostname: grafana
    restart: unless-stopped
    profiles:
      - monitoring
    
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set - do not use default passwords in production}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
    
    volumes:
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
      # Dashboards load through a provider (OPS-24); a JSON dropped straight
      # into provisioning/dashboards/ is ignored.
      - type: bind
        source: ./monitoring/grafana-dashboards.yml
        target: /etc/grafana/provisioning/dashboards/strada-brain.yml
        read_only: true
      - type: bind
        source: ./grafana-dashboard.json
        target: /etc/grafana/dashboards/strada-dashboard.json
        read_only: true
      - type: bind
        source: ./monitoring/grafana-datasource.yml
        target: /etc/grafana/provisioning/datasources/prometheus.yml
        read_only: true
    
    # Host loopback only (OPS-4); put it behind the TLS proxy to publish it.
    # 3001 on the host: 3000 is the Strada web portal.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    
    networks:
      - strada-network
    
    depends_on:
      - prometheus

# =============================================================================
# Volumes
# =============================================================================
volumes:
  strada-home:
    driver: local
  strada-memory:
    driver: local
  strada-logs:
    driver: local
  redis-data:
    driver: local
  nginx-cache:
    driver: local
  letsencrypt-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  strada-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
