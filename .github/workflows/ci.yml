name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install portal dependencies
        run: npm ci --prefix web-portal

      - name: Clone Strada.Core reference
        run: git clone --depth 1 https://github.com/okandemirel/Strada.Core.git /tmp/Strada.Core-ci

      - name: Validate Strada.Core extraction
        run: npm run sync:check -- --core-path /tmp/Strada.Core-ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Portal Security Audit
        run: npm --prefix web-portal run security:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          CI: "1"
        run: npm test

      - name: Dashboard Live Tests
        env:
          LOCAL_SERVER_TESTS: "1"
        run: npm test -- src/dashboard/prometheus.test.ts src/dashboard/websocket-server.test.ts

      - name: Setup and Boot Truthfulness
        run: npm test -- src/core/setup-wizard.test.ts src/core/terminal-wizard.test.ts src/core/setup-doctor.test.ts src/core/boot-report.test.ts src/dashboard/server.test.ts src/tests/unit/package-script-contract.test.ts

      - name: Portal Tests
        run: npm run test:portal

      - name: Build
        run: npm run build

  windows-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # Pinned: GitHub auto-redirects `windows-2025` to `windows-2025-vs2026` by
    # 2026-06-15. Pin the explicit target label so the image flip is controlled,
    # not a surprise.
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install portal dependencies
        run: npm ci --prefix web-portal

      - name: Typecheck
        run: npm run typecheck:src

      - name: Lint
        run: npm run lint:src

      - name: Windows launcher and setup tests
        run: npm exec vitest run src/tests/integration/source-launcher.test.ts src/common/runtime-paths.test.ts src/core/setup-doctor.test.ts src/core/terminal-wizard.test.ts src/vault/path-policy.test.ts src/security/auth-hardened.test.ts src/config/config.test.ts

      - name: Build
        run: npm run build

  # Performance regression gate.
  #
  # Runs on its own job rather than inside `verify` so a timing regression is
  # attributable at a glance and cannot be confused with a failing test. The
  # corpus is regenerated from a fixed seed and its content hash is verified
  # BEFORE anything is timed — a benchmark against a drifted corpus measures
  # nothing.
  bench:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate pinned corpus
        run: npm run bench:corpus

      - name: Verify corpus is reproducible
        run: node scripts/bench/make-corpus.mjs --size S --check

      # The gate skips (and says so) when no baseline exists for this
      # runner/Node combination, so a new runner never fails the build — it
      # just reports that nobody has recorded a baseline there yet.
      - name: Benchmark and gate on regression
        run: npm run bench:check

      # Retrieval quality is machine-independent — same corpus, same index,
      # same query set, no timing — so unlike the latency gate this one has a
      # single baseline and runs everywhere. It exists because the timing
      # benchmarks only answer "is it fast": without it, a change to chunking,
      # BM25 weighting or fusion could get faster while returning worse
      # results, and CI would stay green.
      - name: Build (retrieval quality reads dist/)
        run: npm run build

      - name: Gate on retrieval quality regression
        run: npm run bench:retrieval:check

  # Coverage is reported, not gated. A hard threshold on a 48k-statement
  # codebase mostly produces pressure to write shallow tests; the number is
  # here so a drop is visible in the PR and can be discussed.
  coverage:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        env:
          CI: "1"
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
