name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install portal dependencies
        run: npm ci --prefix web-portal

      - name: Clone Strada.Core reference
        run: git clone --depth 1 https://github.com/okandemirel/Strada.Core.git /tmp/Strada.Core-ci

      - name: Validate Strada.Core extraction
        run: npm run sync:check -- --core-path /tmp/Strada.Core-ci

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Portal Security Audit
        run: npm --prefix web-portal run security:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Before Test, not after: scripts/backup.sh (restore-script.test.ts) runs
      # the compiled helper in dist/, so on a clean runner the suite could only
      # fail there. A broken build also stops the job before minutes of tests.
      - name: Build
        run: npm run build

      - name: Test
        env:
          CI: "1"
        run: npm test

      - name: Dashboard Live Tests
        env:
          LOCAL_SERVER_TESTS: "1"
        run: npm test -- src/dashboard/prometheus.test.ts src/dashboard/websocket-server.test.ts

      - name: Setup and Boot Truthfulness
        run: npm test -- src/core/setup-wizard.test.ts src/core/terminal-wizard.test.ts src/core/setup-doctor.test.ts src/core/boot-report.test.ts src/dashboard/server.test.ts src/tests/unit/package-script-contract.test.ts

      - name: Portal Tests
        run: npm run test:portal

  # Boot what was built (14F6 / D75). verify type-checks, lints, tests and
  # builds, but nothing STARTED the build, so a boot-time crash (a missing
  # import, a stage that throws on an empty home, a port the web channel cannot
  # bind) went green. Its own job and runner, so a boot failure is attributable
  # at a glance and cannot be mistaken for a failing test.
  smoke:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The full build, portal included: the smoke boots the web channel, and
      # the acceptance run packs the file set a release would publish.
      - name: Install portal dependencies
        run: npm ci --prefix web-portal

      - name: Build
        run: npm run build

      # dist/index.js start --channel web in a throwaway home, against a stub
      # Ollama that answers only the reachability probe: /health must answer ok
      # and SIGTERM must end it cleanly. Exit 2 means dist/ is missing.
      - name: Boot smoke
        env:
          BOOT_SMOKE_TIMEOUT_S: "180"
        run: npm run smoke:boot

      # Release acceptance (plan 6.13) against the build above: the packed file
      # set installed clean and booted, an upgrade from a genuinely older
      # release, and backup.sh + restore.mjs round-tripping real databases.
      # Exit 1 (a scenario FAILED) and 2 (no dist/) fail the job. Exit 3 means a
      # runnable scenario did NOT RUN: on this runner the upgrade, until a
      # previous-release tarball is committed under
      # tests/fixtures/release-acceptance/. That is "not proven", never a pass,
      # so it is raised as a warning and written to the job summary and the
      # kept report rather than failing every commit for a missing fixture.
      - name: Release acceptance
        env:
          # strada-brain is not published on npm, so nothing under that name on
          # the registry is this project's; CI never installs and boots it.
          STRADA_ACCEPTANCE_NO_REGISTRY: "1"
        shell: bash
        run: |
          set +e
          npm run accept:release -- --json release-acceptance.json
          code=$?
          set -e
          verdict="$(node -e 'try { console.log(require("./release-acceptance.json").summary.verdict) } catch { console.log("no report written") }')"
          echo "### Release acceptance: ${verdict}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 3 ]; then
            echo "::warning title=Release acceptance NOT PROVEN::${verdict} (see the release-acceptance artifact)"
            exit 0
          fi
          exit "$code"

      - name: Upload release acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance
          path: release-acceptance.json
          if-no-files-found: warn
          retention-days: 14

  windows-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # Pinned: GitHub auto-redirects `windows-2025` to `windows-2025-vs2026` by
    # 2026-06-15. Pin the explicit target label so the image flip is controlled,
    # not a surprise.
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install portal dependencies
        run: npm ci --prefix web-portal

      - name: Typecheck
        run: npm run typecheck:src

      - name: Lint
        run: npm run lint:src

      - name: Windows launcher and setup tests
        run: npm exec vitest run src/tests/integration/source-launcher.test.ts src/common/runtime-paths.test.ts src/core/setup-doctor.test.ts src/core/terminal-wizard.test.ts src/vault/path-policy.test.ts src/security/auth-hardened.test.ts src/config/config.test.ts

      - name: Build
        run: npm run build

  # Performance regression gate.
  #
  # Runs on its own job rather than inside `verify` so a timing regression is
  # attributable at a glance and cannot be confused with a failing test. The
  # corpus is regenerated from a fixed seed and its content hash is verified
  # BEFORE anything is timed — a benchmark against a drifted corpus measures
  # nothing.
  bench:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Order matters. `bench:corpus` REWRITES benchmarks/corpus/manifest.json
      # with whatever it just generated, so checking afterwards compares a fresh
      # generation against a hash written seconds earlier — it always matches and
      # can never detect drift. `--check` generates into a temp dir of its own, so
      # it runs first, against the hash committed to the repository.
      - name: Verify corpus is reproducible
        run: node scripts/bench/make-corpus.mjs --size S --check

      - name: Generate pinned corpus
        run: npm run bench:corpus

      # The gate skips (and says so) when no baseline exists for this
      # runner/Node combination, so a new runner never fails the build — it
      # just reports that nobody has recorded a baseline there yet.
      - name: Benchmark and gate on regression
        run: npm run bench:check

      # Retrieval quality is machine-independent — same corpus, same index,
      # same query set, no timing — so unlike the latency gate this one has a
      # single baseline and runs everywhere. It exists because the timing
      # benchmarks only answer "is it fast": without it, a change to chunking,
      # BM25 weighting or fusion could get faster while returning worse
      # results, and CI would stay green.
      # Backend only. This job never serves the web portal, and it does not run
      # `npm ci --prefix web-portal`, so the portal build has no dependencies to
      # build with — and a failed portal build is deliberately fatal to
      # `npm run build` (a package with a missing UI must not ship silently).
      # STRADA_ALLOW_PORTAL_BUILD_FAILURE is the opt-out that exists for exactly
      # this case; installing the portal's dependencies here would be a minute
      # of CI time spent producing a UI nothing in this job looks at.
      - name: Build backend (retrieval quality reads dist/)
        run: npm run build
        env:
          STRADA_ALLOW_PORTAL_BUILD_FAILURE: "1"

      - name: Gate on retrieval quality regression
        run: npm run bench:retrieval:check

  # Coverage is reported, not gated. A hard threshold on a 48k-statement
  # codebase mostly produces pressure to write shallow tests; the number is
  # here so a drop is visible in the PR and can be discussed.
  coverage:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        env:
          CI: "1"
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
