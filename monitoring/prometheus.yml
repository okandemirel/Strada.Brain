# =============================================================================
# Prometheus Configuration for Strada.Brain
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'strada-brain'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
# rule_files:
#   - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # Strada.Brain metrics
  - job_name: 'strada-brain'
    static_configs:
      - targets: ['strada-brain:9090']
        labels:
          instance: 'strada-brain'
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # No redis or nginx job (OPS-24): Redis does not serve HTTP metrics and the
  # stack runs no redis_exporter or nginx-prometheus-exporter, so those targets
  # were permanently down. Add the exporter service before adding its job.

  # Node exporter (host metrics) - if running externally
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
