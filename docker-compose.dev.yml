# =============================================================================
# Strada.Brain - Docker Compose Development Overrides
# =============================================================================
# Hot reload from ./src, debug logging, no nginx. Never auto-loaded: as
# docker-compose.override.yml it silently turned the documented production
# `docker compose up -d` into this development stack (OPS-5).
#
# To use:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =============================================================================

services:
  strada-brain:
    build:
      target: development
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - DASHBOARD_ENABLED=true
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:ro
      # Mount node_modules to persist
      - node_modules:/app/node_modules
    # Enable interactive debugging
    stdin_open: true
    tty: true
    # Override command for development
    command: ["npm", "run", "dev"]

  # Disable nginx in development (open the portal on http://127.0.0.1:3000)
  nginx:
    profiles:
      - disabled

volumes:
  node_modules:
